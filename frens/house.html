<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The House</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Georgia,'Times New Roman',serif}
  canvas{display:block;touch-action:none;cursor:grab}

  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.9) 100%)}
  #grain{position:fixed;inset:-64px;pointer-events:none;opacity:.07;animation:g .5s steps(4) infinite}
  @keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-23px,17px)}50%{transform:translate(19px,-31px)}75%{transform:translate(-37px,-9px)}100%{transform:translate(0,0)}}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#d9c9a8;background:#000b;padding:8px 16px;border-radius:4px;font-size:13px;pointer-events:none;transition:opacity 1.5s;white-space:nowrap;letter-spacing:.5px}
  #lvl{position:fixed;left:14px;bottom:14px;color:#a89572;font-size:12px;letter-spacing:2px;pointer-events:none;text-transform:uppercase}
  #ui{position:fixed;top:12px;right:12px;display:flex;gap:10px;align-items:center;color:#cbb88f;font-size:12px}
  #ui button{background:#000a;color:#d9c9a8;border:1px solid #cbb88f44;border-radius:3px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  #ui button:hover{background:#000d}
  #ui input{width:90px;accent-color:#b8873a}

  #ui button[hidden]{display:none}
  #ui #bPlay{white-space:nowrap}
  #mp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;z-index:30;color:#d9c9a8}
  #mp[hidden],#mpRoom[hidden],#mpSetup[hidden],#mpJoinRow[hidden],#chat[hidden]{display:none}

  #mp h2{margin:0 0 12px;font-weight:normal;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#cbb88f}
  #mp input[type=text]{background:#000a;color:#d9c9a8;border:1px solid #cbb88f44;border-radius:3px;padding:8px 10px;font:inherit;font-size:14px;outline:none;width:100%;box-sizing:border-box}
  #mp input[type=text]:focus{border-color:#b8873a}
  #mp button{background:#000a;color:#d9c9a8;border:1px solid #cbb88f44;border-radius:3px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  #mp button:hover{background:#1a140c}
  #mp button:disabled{opacity:.4;cursor:default}

  #chatInput:focus{border-color:#b8873a}

</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

</div></div>

<button id="bE">E</button><div id="eLbl"></div>

function buildRegions() {

      const dx = def.xc - s * 1.0; const za = def.zc + s * 1.9, zb = s > 0 ? -0.95 : 0.95; Rg(dx - 0.3, dx + 0.3, Math.min(za, zb), Math.max(za, zb), Y);

    }

}

/* ───────────── Character factory (from character.html) ───────────── */
const CG_DEFAULTS = {
  height:      1.66,
  skinColor:   0xe8c4b0,
  outfitColor: 0x1a1824,
  accentColor: 0xa02050,
  hairColor:   0x16131e,
  bootColor:   0x0e0c16,
  eyeColor:    0xd43560,
  lipColor:    0x6a1a2c,
};

const CG_GEO = {
  sphere: new THREE.SphereGeometry(0.5, 20, 14),
  box:    new THREE.BoxGeometry(1, 1, 1),
};
const _cgCylCache = new Map();
function cgCyl(rt, rb, seg = 10, open = false) {
  const k = rt + '|' + rb + '|' + seg + '|' + (open ? 1 : 0);
  let g = _cgCylCache.get(k);
  if (!g) { g = new THREE.CylinderGeometry(rt, rb, 1, seg, 1, open); _cgCylCache.set(k, g); }
  return g;
}
function cgMesh(geo, mat, sx, sy, sz, px, py, pz) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(px || 0, py || 0, pz || 0);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function createGothicGirl(opts = {}) {
  const o = Object.assign({}, CG_DEFAULTS, opts);
  const root = new THREE.Group();

    skin:  new THREE.MeshStandardMaterial({ color: o.skinColor,   roughness: 0.66, metalness: 0.00 }),
    outfit:new THREE.MeshStandardMaterial({ color: o.outfitColor, roughness: 0.80, metalness: 0.10 }),

    hair:  new THREE.MeshStandardMaterial({ color: o.hairColor,   roughness: 0.40, metalness: 0.35 }),
    boot:  new THREE.MeshStandardMaterial({ color: o.bootColor,   roughness: 0.32, metalness: 0.45 }),
    white: new THREE.MeshStandardMaterial({ color: 0xf4eff8,      roughness: 0.22 }),
    iris:  new THREE.MeshStandardMaterial({ color: o.eyeColor,    roughness: 0.18, metalness: 0.15,
                                            emissive: o.eyeColor, emissiveIntensity: 0.45 }),
    pupil: new THREE.MeshStandardMaterial({ color: 0x0a0810,      roughness: 0.12 }),
    lip:   new THREE.MeshStandardMaterial({ color: o.lipColor,    roughness: 0.28 }),

  M.skirt = M.outfit.clone();

  const box  = (m, w, h, d, x, y, z) => cgMesh(CG_GEO.box,    m, w, h, d, x, y, z);
  const limb = (m, rt, rb, len) => {
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(cgCyl(rt, rb, 10), m);
    mesh.scale.y = len;
    mesh.position.y = -len / 2;
    mesh.castShadow = mesh.receiveShadow = true;
    g.add(mesh);
    return g;
  };

  /* ═══════════════════════════════ HIPS / TORSO ═══════════════════════════════ */
  const hips = new THREE.Group();
  hips.position.y = 0.92;
  root.add(hips);

  hips.add(ball(M.outfit, 0.220, 0.190, 0.165, 0, -0.012, 0));

  const skirt = new THREE.Mesh(cgCyl(0.122, 0.215, 20, true), M.skirt);
  skirt.scale.y = 0.34;
  skirt.position.y = -0.13;
  skirt.castShadow = skirt.receiveShadow = true;
  hips.add(skirt);

  // skirt hem trim
  const hem = new THREE.Mesh(new THREE.TorusGeometry(0.215, 0.010, 5, 24), M.accent);
  hem.rotation.x = Math.PI / 2;
  hem.position.y = -0.30;
  hips.add(hem);

  const spine = new THREE.Group();
  spine.position.y = 0.045;
  hips.add(spine);

  const chest = new THREE.Group();
  chest.position.y = 0.145;
  spine.add(chest);

  const torso = new THREE.Mesh(cgCyl(0.140, 0.088, 16), M.outfit);
  torso.scale.y = 0.345;
  torso.position.y = 0.095;
  torso.castShadow = torso.receiveShadow = true;
  chest.add(torso);

  chest.add(ball(M.outfit, 0.215, 0.145, 0.155, 0, 0.085, 0.032));

  // corset lacing
  const rAt = y => 0.088 + ((y + 0.08) / 0.345) * 0.052;
  for (let i = 0; i < 7; i++) {
    const y = -0.065 + i * 0.028;
    const lace = box(M.accent, 0.056, 0.007, 0.009, 0, y, rAt(y) + 0.004);
    lace.rotation.z = (i % 2 ? 1 : -1) * 0.55;

  }

  /* ═══════════════════════════════ NECK / HEAD ═══════════════════════════════ */
  const neck = new THREE.Group();
  neck.position.y = 0.235;
  chest.add(neck);
  neck.add(cgMesh(cgCyl(0.037, 0.043, 10), M.skin, 1, 0.090, 1, 0, 0.032, 0));

  const choker = new THREE.Mesh(new THREE.TorusGeometry(0.044, 0.009, 6, 20), M.accent);
  choker.rotation.x = Math.PI / 2;
  choker.position.y = 0.020;
  choker.castShadow = true;
  neck.add(choker);

  const headPivot = new THREE.Group();
  headPivot.position.y = 0.075;
  neck.add(headPivot);

  const head = new THREE.Group();
  head.position.y = 0.100;
  headPivot.add(head);

  /* ---- skull & jaw ---- */
  head.add(ball(M.skin, 0.200, 0.230, 0.200, 0, 0, 0));
  head.add(ball(M.skin, 0.152, 0.100, 0.150, 0, -0.072, 0.024));   // jaw / chin

  /* ---- eyes ---- */
  const EX = 0.043, EY = 0.014;
  for (const s of [-1, 1]) {
    const ex = EX * s;
    // socket shadow
    head.add(ball(M.lash, 0.046, 0.038, 0.012, ex, EY + 0.002, 0.084));
    // white
    head.add(cgMesh(CG_GEO.sphere, M.white, 0.038, 0.032, 0.018, ex, EY, 0.090));
    // iris
    head.add(cgMesh(CG_GEO.sphere, M.iris,  0.024, 0.024, 0.012, ex, EY, 0.098));
    // pupil

  const strands = [];
  function strand(x, y, z, w, h, d, rx, rz, amp, phase) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    g.rotation.set(rx, 0, rz);

  // choppy boy-cut bangs (short, above the eyes so the face stays visible)
  const bangX = [-0.078, -0.048, -0.016, 0.016, 0.048, 0.078];
  bangX.forEach((x, i) => {
    const h = i % 2 ? 0.055 : 0.070;
    strand(x, 0.088, 0.070, 0.030, h, 0.045,
           -0.20, (i % 2 ? 1 : -1) * 0.14, 0.10, i * 0.85);
  });

  // side sweeps
  strand(-0.092, 0.060, 0.028, 0.034, 0.150, 0.062,  0.02,  0.13, 0.14, 1.7);
  strand( 0.092, 0.060, 0.028, 0.034, 0.150, 0.062,  0.02, -0.13, 0.14, 2.4);
  // long asymmetric gothic strand
  strand( 0.086, 0.072, 0.058, 0.026, 0.210, 0.040, -0.04, -0.17, 0.17, 3.1);
  strand(-0.086, 0.072, 0.058, 0.024, 0.170, 0.040, -0.04,  0.17, 0.15, 3.7);

  function buildArm(side) {

    shoulder.rotation.z = 0.14 * side;
    chest.add(shoulder);

    shoulder.add(ball(M.outfit, 0.108, 0.100, 0.108, 0.008 * side, -0.010, 0));
    shoulder.add(ball(M.accent, 0.104, 0.018, 0.104, 0.008 * side, -0.056, 0)); // sleeve trim

    const upper = new THREE.Group();
    shoulder.add(upper);
    upper.add(limb(M.skin, 0.043, 0.036, 0.265));
    upper.add(ball(M.skin, 0.074, 0.074, 0.074, 0, -0.265, 0));

    const lower = new THREE.Group();
    lower.position.y = -0.265;
    upper.add(lower);
    lower.add(limb(M.outfit, 0.046, 0.036, 0.245));

    cuff.position.y = -0.238;
    cuff.castShadow = true;

    hand.add(box(M.skin, 0.030, 0.082, 0.068, 0, -0.041, 0));

    const fdef = [
      { z: -0.0240, l1: 0.028, l2: 0.024, r: 0.0075, curl: 0.55 },
      { z: -0.0080, l1: 0.032, l2: 0.027, r: 0.0080, curl: 0.60 },
      { z:  0.0080, l1: 0.031, l2: 0.026, r: 0.0080, curl: 0.60 },
      { z:  0.0240, l1: 0.026, l2: 0.022, r: 0.0072, curl: 0.55 },
    ];
    for (const d of fdef) {
      const base = new THREE.Group();
      base.position.set(0, -0.082, d.z);
      hand.add(base);

      const s1 = new THREE.Mesh(cgCyl(d.r, d.r * 0.92, 6), M.skin);
      s1.scale.y = d.l1; s1.position.y = -d.l1 / 2; s1.castShadow = true;
      base.add(s1);

      const mid = new THREE.Group();
      mid.position.y = -d.l1;
      base.add(mid);

      const s2 = new THREE.Mesh(cgCyl(d.r * 0.92, d.r * 0.75, 6), M.skin);

  }

  /* ═══════════════════════════════ LEGS ═══════════════════════════════ */
  function buildLeg(side) {
    const hipJoint = new THREE.Group();
    hipJoint.position.set(0.076 * side, -0.030, 0);

    const thigh = new THREE.Group();

    knee.position.y = -0.420;
    thigh.add(knee);
    knee.add(ball(M.outfit, 0.102, 0.102, 0.102, 0, 0, 0));

    const shin = new THREE.Group();
    knee.add(shin);
    shin.add(limb(M.boot, 0.060, 0.046, 0.400));

    const cuff = new THREE.Mesh(cgCyl(0.064, 0.082, 12), M.boot);
    cuff.scale.y = 0.078;
    cuff.position.y = -0.050;
    cuff.castShadow = true;
    shin.add(cuff);

    const foot = new THREE.Group();
    foot.position.y = -0.400;
    shin.add(foot);
    foot.add(box(M.boot, 0.078, 0.058, 0.170, 0, -0.040, 0.036));
    foot.add(ball(M.boot, 0.076, 0.058, 0.092, 0, -0.042, 0.118));
    foot.add(box(M.accent, 0.079, 0.010, 0.055, 0, -0.012, 0.078)); // strap

    return { hipJoint, thigh, knee, shin, foot };
  }

  const armL = buildArm( 1), armR = buildArm(-1);
  const legL = buildLeg( 1), legR = buildLeg(-1);
  const allFingers = armL.fingers.concat(armR.fingers);

  /* ═══════════════════════════════ ANIMATION ═══════════════════════════════ */
  let time = 0;
  let walkPhase = 0;
  let walkBlend = 0;
  let walkTarget = 0, sitBlend = 0, sitTarget = 0, lookX = 0, lookY = 0;

  function update(dt, dist) {
    dt = Math.min(dt || 0.016, 0.05);
    time += dt;
    walkBlend += (walkTarget - walkBlend) * Math.min(1, dt * 5);
    sitBlend += (sitTarget - sitBlend) * Math.min(1, dt * 6);
    walkPhase += (dist === undefined ? dt * 6.2 : dist * 4.4);

    const w = walkBlend;
    const idle = 1 - w;
    const p  = walkPhase;
    const sw = Math.sin(p);
    const cw = Math.cos(p);
    const breathe = Math.sin(time * 1.55) * idle;

    /* ---------- hips ---------- */
    hips.position.y = 0.92 - 0.070 * sw * sw * w + breathe * 0.004;
    hips.position.x = 0.014 * sw * w;
    hips.rotation.y = -0.11 * sw * w + Math.sin(time * 0.50) * 0.010 * idle;
    hips.rotation.z =  0.030 * sw * w + Math.sin(time * 0.70) * 0.007 * idle;
    hips.rotation.x =  0.020 * w + breathe * 0.006;

    /* ---------- spine / chest ---------- */
    spine.rotation.x =  0.030 * w + breathe * 0.010;
    spine.rotation.y =  0.060 * sw * w;
    spine.rotation.z = -0.020 * sw * w;

    chest.rotation.y =  0.100 * sw * w + Math.sin(time * 0.45) * 0.018 * idle;
    chest.rotation.x = -0.020 * w - breathe * 0.010;

    /* ---------- head (stabilised) ---------- */
    headPivot.rotation.y = -0.045 * sw * w + Math.sin(time * 0.40) * 0.09 * idle + lookY;
    headPivot.rotation.x = -0.015 * w + Math.sin(time * 0.60) * 0.025 * idle + lookX;
    headPivot.rotation.z = Math.sin(time * 0.35) * 0.022 * idle;

    /* ---------- legs ---------- */
    const thighL =  sw * 0.42 * w;
    const thighR = -sw * 0.42 * w;
    legL.thigh.rotation.x = thighL;
    legR.thigh.rotation.x = thighR;
    legL.thigh.rotation.z =  0.015 * idle;
    legR.thigh.rotation.z = -0.015 * idle;

    const kneeL = Math.pow(Math.max(0, -cw), 0.8) * 0.95 * w;
    const kneeR = Math.pow(Math.max(0,  cw), 0.8) * 0.95 * w;

    if (VMODES[mp.vm].m && !mp.micOK) logMsg('', 'Microphone is unavailable — allow mic access in your browser and rejoin.', true);
  };
}

/* interactions: press E (or the E button). Add more by pushing a function onto `interactables`
   that returns { label, use } when the player is near something, or null. */
const lastP = { x: pos.x, z: pos.z }; let stepAcc = 0, sendT = 0;
let seatState = null, eyeH = 1.55, curInteract = null, lastLbl = null;
const interactables = [];
const BED = { x0: -2.95, x1: -0.95, z0: -1.75, z1: -0.35 };
function sitDown(R, s, lx) {
  const slx = Math.max(-1.8, Math.min(-1.3, lx)), p = tW(R.def, R.f, slx, 0, -0.65), st = tW(R.def, R.f, slx, 0, 0.2);
  const ok = sample(st[0], st[2], floorY) !== null;
  seatState = { x: p[0], z: p[2], stx: ok ? st[0] : pos.x, stz: ok ? st[2] : pos.z, face: s > 0 ? Math.PI : 0, t: 0, leaving: false };
}
function standUp() { if (seatState && !seatState.leaving) { seatState.leaving = true; seatState.t = 0; } }
interactables.push(() => {
  if (seatState) return { label: 'Stand', use: standUp };
  let best = null, bd = 1e9;
  for (const R of rooms) {
    if (R.f !== curFloor) continue; const s = Math.cos(R.def.rot), lx = (pos.x - R.def.xc) * s, lz = (pos.z - R.def.zc) * s;
    if (Math.abs(lx) > 3.1 || Math.abs(lz) > 2.6) continue;
    const d = Math.hypot(Math.max(BED.x0 - lx, 0, lx - BED.x1), Math.max(BED.z0 - lz, 0, lz - BED.z1));
    if (d < 0.95 && d < bd) { bd = d; best = { R, s, lx }; }
  }
  return best && { label: 'Sit', use: () => sitDown(best.R, best.s, best.lx) };
});
function useInteract() { if (!curInteract || $id('mp').hidden === false) return; if (seatState && (seatState.leaving || seatState.t < 0.5)) return; curInteract.use(); }
$id('bE').addEventListener('click', useInteract);
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'e' && !e.repeat && document.activeElement !== chatInput) useInteract(); });

function mpUpdate(dt, t) {
  const mvx = pos.x - lastP.x, mvz = pos.z - lastP.z; lastP.x = pos.x; lastP.z = pos.z; const md = Math.hypot(mvx, mvz);
  /* seating */
  if (seatState) {
    const S = seatState; S.t += dt; const tx = S.leaving ? S.stx : S.x, tz = S.leaving ? S.stz : S.z, k = Math.min(1, dt * (S.leaving ? 9 : 6));
    pos.x += (tx - pos.x) * k; pos.z += (tz - pos.z) * k;
    if (!S.leaving) {
      eyeH = 1.38;
      if (S.t < 0.9) { let da = S.face - yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); yaw += da * Math.min(1, dt * 4); }
      if (S.t > 0.5 && (keys['w'] || keys['a'] || keys['s'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright'])) standUp();
    } else { eyeH = 1.55; if (S.t > 0.45 || Math.hypot(pos.x - tx, pos.z - tz) < 0.03) seatState = null; }
  }
  /* E button state */
  curInteract = null; for (const f of interactables) { const r = f(); if (r) { curInteract = r; break; } }
  const lb = curInteract ? curInteract.label : ''; if (lb !== lastLbl) { lastLbl = lb; $id('eLbl').textContent = lb; $id('bE').classList.toggle('act', !!lb); }
  /* own footsteps */
  if (!seatState && md > 0 && md < 1) { stepAcc += md; if (stepAcc >= (keys['shift'] ? 1.0 : 0.72)) { stepAcc = 0; playStep(0.45, 0, (floorY > 0.05 && floorY < FH - 0.05) ? 1.25 : 1, null); } }
  if (!mp.joined) return;
  /* don't walk through other players */
  if (!seatState) for (const r of mp.players.values()) {
    if (!r.snap || Math.abs(r.group.position.y - floorY) > 1.5) continue;
    const dx = pos.x - r.group.position.x, dz = pos.z - r.group.position.z, d = Math.hypot(dx, dz);
    if (d < 0.45 && d > 0.001) { const pu = (0.45 - d) * 0.5, nx = pos.x + dx / d * pu, nz = pos.z + dz / d * pu; if (sample(nx, pos.z, floorY) !== null) pos.x = nx; if (sample(pos.x, nz, floorY) !== null) pos.z = nz; }
  }
  sendT -= dt; if (sendT <= 0) { sendT = 0.066; bcast({ t: 's', x: +pos.x.toFixed(3), y: +floorY.toFixed(3), z: +pos.z.toFixed(3), yaw: +yaw.toFixed(3), pit: +pitch.toFixed(2), sit: seatState && !seatState.leaving ? 1 : 0 }); }
  const kk = 1 - Math.exp(-dt * 12), rx = Math.cos(yaw), rz = -Math.sin(yaw), now = actx ? actx.currentTime : 0, cl = (v, a) => Math.max(-a, Math.min(a, v));
  for (const r of mp.players.values()) {
    if (!r.snap) continue; const g = r.group, px = g.position.x, pz = g.position.z;
    g.position.x += (r.tx - px) * kk; g.position.z += (r.tz - pz) * kk; g.position.y += (r.ty - g.position.y) * kk;
    const mv = Math.hypot(g.position.x - px, g.position.z - pz), moving = mv / Math.max(dt, 0.001) > 0.25 && !r.sitT;
    let da = r.tyaw + Math.PI - g.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (moving) g.rotation.y += da * kk * 0.7; else if (Math.abs(da) > 0.75) g.rotation.y += (da - Math.sign(da) * 0.75) * kk * 0.6;
    da = r.tyaw + Math.PI - g.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
    r.girl.setLook(cl(-(r.pit || 0) * 0.7, 0.6), cl(da, 0.75)); r.girl.setSit(r.sitT); r.girl.setWalk(moving);
    r.girl.update(dt, Math.min(mv, 0.3)); r.sb += ((r.sitT || 0) - r.sb) * Math.min(1, dt * 6);
    r.tag.position.y = 1.72 - 0.13 * r.sb; if (r.bubble) r.bubble.position.y = r.tag.position.y + 0.12;
    g.visible = Math.abs(g.position.y - floorY) < 2.2;
    const dx = g.position.x - pos.x, dz = g.position.z - pos.z, dh = Math.hypot(dx, dz), d = dh + (Math.abs(g.position.y - floorY) > 1.5 ? 5 : 0), gain = vg(d);
    const pan = (dx * rx + dz * rz) / (dh || 1) * 0.8 * Math.min(1, dh / 1.5);
    if (moving) { r.stepAcc += mv; if (r.stepAcc >= 0.75) { r.stepAcc = 0; playStep(gain * 0.5, pan, 1, masterVoice); } }
    const v = mp.voice.get(r.id); if (v && actx) { v.g.gain.setTargetAtTime(gain, now, 0.06); v.p.pan.setTargetAtTime(pan, now, 0.06); }
    if (r.bubble && t > r.bubbleEnd) { killSprite(r.bubble); r.bubble = null; }
  }
}

addEventListener('keydown', e => { if (e.key === 'Enter' && mp.joined && $id('mp').hidden && document.activeElement !== chatInput) { e.preventDefault(); chatInput.focus(); } });

let hallGroups = [], dustPos, dust, curFloor = 0;
function setupWorld() {
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); scene.environmentIntensity = 0.07;
  scene.add(new THREE.HemisphereLight(0x4a5a80, 0x1a120a, 0.1));
  buildRoomTemplate(); buildHallTemplate(); buildOutside();
  let idx = 0; for (let f = 0; f < 2; f++) for (const def of roomDefs) makeRoom(def, f, idx++);
  for (let f = 0; f < 2; f++) { const g = partsToGroup(hallParts); g.position.y = f * FH; scene.add(g); hallGroups.push(g); for (const m of hallMarks) candles.push({ x: m.x, y: m.y + f * FH, z: m.z, room: -1, ph: rnd() * 100 }); for (const [x, z] of [[-1.0, -1.0], [1.0, 1.0]]) anchors.push({ x, y: f * FH + 0.98, z, f, base: 10 }); }
  const sm = buildStairHalls(); for (const m of sm) { candles.push({ x: m.x, y: m.y, z: m.z, room: -1, ph: rnd() * 100 }); anchors.push({ x: m.x, y: m.y, z: m.z, f: 0, base: 8 }); }
  buildRegions(); buildFlames(); buildLightPool();
  const N = 220; dustPos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { dustPos[i * 3] = (rnd() - 0.5) * 6; dustPos[i * 3 + 1] = rnd() * 2.7; dustPos[i * 3 + 2] = (rnd() - 0.5) * 6; }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dustPos, 3)); dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xaebcff, size: 0.014, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending })); dust.frustumCulled = false; scene.add(dust);
  pickLights(pos.x, floorY + 1.55, pos.z, true);
}

/* ───────────── Loop ───────────── */
let last = performance.now(), lastRender = 0; const lvlEl = document.getElementById('lvl');
function tick(now) {
  requestAnimationFrame(tick);
  if (now - lastRender < minFrame - 2) return;
  const dt = Math.min((now - last) / 1000, 0.1); last = now; lastRender = now; const t = now / 1000;

  /* movement with stairs */
  const f = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0), r = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  if ((f || r) && !seatState) { const sp = 1.4 * dt * (keys['shift'] ? 1.8 : 1), dx = (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp;
    let y = sample(pos.x + dx, pos.z, floorY); if (y !== null) { pos.x += dx; floorY = y; }
    y = sample(pos.x, pos.z + dz, floorY); if (y !== null) { pos.z += dz; floorY = y; } }
  pos.y += (floorY + eyeH - pos.y) * Math.min(1, dt * 12);
  mpUpdate(dt, t);

  /* which floor / which rooms to draw */
  const fl = floorY > 1.5 ? 1 : 0; if (fl !== curFloor) { curFloor = fl; lvlEl.textContent = fl ? 'Upper floor' : 'Ground floor'; }
  for (const R of rooms) R.group.visible = R.f === curFloor;

  /* light pool */
  selTimer -= dt; if (selTimer <= 0) { selTimer = 0.25; pickLights(pos.x, pos.y, pos.z, false); }
  for (const s of slots) {
    const want = s.a && sel.includes(s.a) ? 1 : 0; s.cur += (want - s.cur) * Math.min(1, dt * 5);
    if (!want && s.cur < 0.03) { const free = sel.find(a => !slots.some(o => o.a === a)); if (free) { s.a = free; s.l.position.set(free.x, free.y, free.z); } }
    const n = Math.sin(t * 9 + s.ph) * 0.5 + Math.sin(t * 23.7 + s.ph * 2.3) * 0.3 + Math.sin(t * 5.1 + s.ph * 0.7) * 0.2;
    s.l.intensity = s.a ? s.cur * s.a.base * (0.82 + 0.18 * n + (Math.random() - 0.5) * 0.05) : 0;
  }
  /* flames */
  for (let i = 0; i < candles.length; i++) {
    const c = candles[i], vis = c.room < 0 || rooms[c.room].f === curFloor; const n = Math.sin(t * 11 + c.ph) * 0.4 + Math.sin(t * 27 + c.ph * 1.7) * 0.3 + Math.random() * 0.2, b = vis ? 0.75 + 0.3 * n : 0;
    fCol[i * 3] = b; fCol[i * 3 + 1] = b * 0.95; fCol[i * 3 + 2] = b * 0.9; const gb = b * 0.9; gCol[i * 3] = gb; gCol[i * 3 + 1] = gb * 0.9; gCol[i * 3 + 2] = gb * 0.8;
  }
  flamePts.geometry.attributes.color.needsUpdate = true; glowPts.geometry.attributes.color.needsUpdate = true;
  /* rocking chairs + dolls that watch you */
  for (const R of rooms) { if (R.f !== curFloor) continue; R.rock.rotation.x = Math.sin(t * 0.8 + R.ph) * 0.05;
    const p = tW(R.def, R.f, 0.95, 0, -1.78); let a = Math.atan2(pos.x - p[0], pos.z - p[2]) - R.def.rot; a = Math.atan2(Math.sin(a), Math.cos(a)); const tg = Math.max(-1.1, Math.min(1.1, a)); R.head.rotation.y += (tg - R.head.rotation.y) * 0.03; R.head.rotation.z = Math.sin(t * 0.35 + R.ph) * 0.06; }
  /* dust follows you */
  for (let i = 0; i < dustPos.length; i += 3) { dustPos[i] += Math.sin(t * 0.3 + i) * 0.0006; dustPos[i + 1] += Math.sin(t * 0.2 + i * 1.7) * 0.0004 - 0.00012; dustPos[i + 2] += Math.cos(t * 0.25 + i) * 0.0006;
    if (dustPos[i] - pos.x > 3) dustPos[i] -= 6; else if (dustPos[i] - pos.x < -3) dustPos[i] += 6; if (dustPos[i + 2] - pos.z > 3) dustPos[i + 2] -= 6; else if (dustPos[i + 2] - pos.z < -3) dustPos[i + 2] += 6;
    if (dustPos[i + 1] < floorY + 0.1) dustPos[i + 1] = floorY + 2.7; else if (dustPos[i + 1] > floorY + 2.8) dustPos[i + 1] = floorY + 0.2; }
  dust.geometry.attributes.position.needsUpdate = true;

  cam.position.copy(pos); cam.rotation.set(pitch, yaw, 0);
  renderer.render(scene, cam);
  if (qMode === 0) { acc += dt; if (++samples >= 60) { if (acc / samples > 0.045 && pr > 0.65) applyPR(Math.max(0.65, pr - 0.2)); samples = 0; acc = 0; } }
}

setTimeout(() => {
  setupWorld();
  cam.position.copy(pos); cam.rotation.set(pitch, yaw, 0); renderer.render(scene, cam);
  const L = document.getElementById('load'); L.style.opacity = 0; setTimeout(() => L.remove(), 1000);
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 9000);
  requestAnimationFrame(tick);
}, 40);
</script>
